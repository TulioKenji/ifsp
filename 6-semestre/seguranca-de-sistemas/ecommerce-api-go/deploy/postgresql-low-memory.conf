# Exemplo para um PostgreSQL dedicado ao laboratório (não substitui postgresql.conf).
# Inclua via include_dir/conf.d, reinicie e meça com sua carga real.
# Não usar em um cluster compartilhado sem avaliar os demais bancos.
listen_addresses = '127.0.0.1'
max_connections = 24
shared_buffers = '32MB'
work_mem = '1MB'
maintenance_work_mem = '16MB'
effective_cache_size = '128MB'
password_encryption = 'scram-sha-256'
